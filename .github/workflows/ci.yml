name: Jekyll

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Ruby and install gems
      uses: ruby/setup-ruby@v1
      with:
        # Jekyll 3.9 relies on stdlib gems (e.g. csv) that Ruby 3.4 no longer bundles
        ruby-version: '3.1'
        bundler-cache: true
    - name: Build the site
      run: bundle exec jekyll build --future
